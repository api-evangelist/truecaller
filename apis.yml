aid: truecaller
name: Truecaller
description: >-
  Truecaller is the Stockholm-based caller identification and spam-blocking
  platform (atomico and balderton-capital portfolio) used by hundreds of
  millions of people to know who is calling. For developers it publishes the
  Truecaller SDK for Android, iOS, mobile web, Flutter, React Native and
  Shopify - one-tap phone-number verification built on OAuth 2.0 with PKCE
  (authorization code + refresh token, OIDC-style userinfo) plus a drop-call /
  IM-OTP flow for non-Truecaller users. Truecaller for Business adds REST APIs
  on enterprise-portal-noneu.truecaller.com for verified business caller ID:
  call personalisation (dynamic caller ID), number management, verified
  campaigns, and Call Me Back / User Feedback webhooks.
