apis:
- aid: truecaller:truecaller-oauth-api
  name: Truecaller OAuth User Verification API
  humanURL: https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/integrating-with-your-backend
  baseURL: https://oauth-account-noneu.truecaller.com
  tags:
  - Authentication
  - OpenID Connect
  - Phone Verification
  - Identity
  - Token
  - UserInfo
  tags_raw:
  - OAuth
  - OpenID Connect
  - Phone Verification
  - Identity
  - Token
  - UserInfo
  description: >-
    The backend half of the Truecaller OAuth SDK flow. After the mobile SDK
    returns an authorization code, partners exchange it at POST /v1/token
    (authorization_code grant with PKCE code_verifier; refresh_token also
    supported) and fetch the verified user profile at GET /v1/userinfo with
    the Bearer access token. The host publishes OpenID Connect discovery at
    /.well-known/openid-configuration with /v1/auth, /v1/token, /v1/revoke,
    per-client JWKS, RS256 id tokens, and S256 PKCE.
  properties:
  - url: https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/integrating-with-your-backend/fetching-user-token
    type: Documentation
  - url: https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/integrating-with-your-backend/fetching-user-profile
    type: APIReference
- aid: truecaller:truecaller-otp-verification-api
  name: Truecaller Non-Truecaller User Verification API
  humanURL: https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/non-truecaller-user-verification/server-side-validation
  baseURL: https://sdk-otp-verification-noneu.truecaller.com
  tags:
  - Phone Verification
  - OTP
  - Missed Call
  - Validation
  description: >-
    Server-side validation for the drop-call / IM-OTP verification flow that
    covers users without the Truecaller app. GET
    /v1/otp/client/installation/phoneNumberDetail/{accessToken} (clientId
    header) returns the verified phone number and country code for the access
    token issued by the SDK.
  properties:
  - url: https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/non-truecaller-user-verification/server-side-validation
    type: Documentation
- aid: truecaller:truecaller-web-sdk-profile-api
  name: Truecaller Web SDK Profile API
  humanURL: https://docs.truecaller.com/truecaller-sdk/mobile-websites/integrating-with-your-mobile-website/fetch-user-profile
  baseURL: https://profile4-noneu.truecaller.com
  tags:
  - Phone Verification
  - Profile
  - Mobile Web
  description: >-
    Profile retrieval for the mobile-web (deep link) verification flow. After
    a user consents in the Truecaller app, Truecaller POSTs the accessToken
    and requestId to the partner's callback URL together with the profile
    endpoint (GET /v1/default with Bearer token), which returns the user's
    verified phone numbers, name, addresses and online identities.
  properties:
  - url: https://docs.truecaller.com/truecaller-sdk/mobile-websites/integrating-with-your-mobile-website/fetch-user-profile
    type: Documentation
- aid: truecaller:truecaller-for-business-api
  name: Truecaller for Business API
  humanURL: https://docs.truecaller.com/truecaller-for-business/verified-business-api-documentation/getting-started
  baseURL: https://enterprise-portal-noneu.truecaller.com
  tags:
  - Verified Business Caller ID
  - Call Personalisation
  - Number Management
  - Verified Campaigns
  - Webhook
  tags_raw:
  - Verified Business Caller ID
  - Call Personalisation
  - Number Management
  - Verified Campaigns
  - Webhooks
  description: >-
    REST APIs for Truecaller's Verified Business Caller ID platform. Partners
    exchange a Key ID + Secret API Key for a 60-minute bearer token (POST
    /clients/{clientAccountId}/token), then push dynamic caller-ID
    personalisation in real time (POST
    /v2/clients/{clientAccountId}/dynamic_call_record, 100 rps per token) or
    batch, check batch status, read dynamic labels, list/delist business
    numbers under feature sets, and run Verified Campaigns (bulk upload and
    exit via enterprise-webhooks-noneu.truecaller.com). Call Me Back and User
    Feedback events are delivered by configurable webhooks.
  properties:
  - url: https://docs.truecaller.com/truecaller-for-business/verified-business-api-documentation/getting-started
    type: Documentation
  - url: https://docs.truecaller.com/truecaller-for-business/verified-business-api-documentation/getting-started/generate-access-token
    type: GettingStarted
